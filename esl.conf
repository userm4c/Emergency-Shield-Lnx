# ==============================================================================
# PROJETO: Emergency Shield Lnx — Arquivo de Configuração
# Edite este arquivo para personalizar o comportamento do ESL.
# O script principal (esl.sh) carrega este arquivo automaticamente.
# Atualizações via "git pull" não sobrescrevem suas configurações.
# ==============================================================================

# --- USUÁRIO E CAMINHOS ---
LOGFILE="/home/SEU_USUARIO/esl.log"
ESL_HISTORY="/home/SEU_USUARIO/esl_history.json"

# --- NOTIFICAÇÕES (ntfy.sh) ---
NTFY_TOPIC="seu_topico_secreto_aqui"

# --- SERVIÇOS GERENCIADOS ---
# Diretórios com docker-compose.yml a parar/retomar (separados por espaço)
DOCKER_COMPOSE_DIRS=""

# Serviços systemd a parar antes de hibernar (separados por espaço)
SERVICOS_GERENCIADOS=""

# --- THRESHOLDS DE BATERIA ---
# Nível em que o sistema hiberna para preservar integridade
LIMITE_HIBERNACAO=30

# Taxa de dreno anormal em %/min que dispara alerta urgente (ex: 2 = 2%/min)
LIMITE_DRENO_RAPIDO=2

# Temperatura máxima da bateria em °C antes de alertar
LIMITE_TEMP_BATERIA=45

# Saúde mínima da bateria (%) antes de alertar para substituição
LIMITE_SAUDE_BATERIA=70

# --- MODO SILENCIOSO ---
# Alarme sonoro desativado neste intervalo (notificações push continuam ativas)
HORA_SILENCIO_INICIO=22
HORA_SILENCIO_FIM=7

# --- LOG ---
# Tamanho máximo do log antes de rotacionar (KB)
LOG_MAX_KB=500
